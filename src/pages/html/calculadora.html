<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/components/basics-layout.css">
    <link rel="stylesheet" href="../css/calculadora.css">

</head>

<body>
    <header>
        <h1>Calculadora</h1>
    </header>
    <img class="icons-3" src="https://i.pinimg.com/originals/00/59/3d/00593dcb713478b402a877fa1669f8d2.gif" />
    <main>
        <section class="calculadora">
            <input type="text" id="display" readonly>
            <div class="botoes">
                <button onclick="limpar()">C</button>
                <button onclick="adicionar('/')">/</button>
                <button onclick="adicionar('*')">*</button>
                <button onclick="adicionar('-')">-</button>

                <button onclick="adicionar('7')">7</button>
                <button onclick="adicionar('8')">8</button>
                <button onclick="adicionar('9')">9</button>
                <button onclick="adicionar('+')">+</button>

                <button onclick="adicionar('4')">4</button>
                <button onclick="adicionar('5')">5</button>
                <button onclick="adicionar('6')">6</button>
                <button onclick="calcular()" style="grid-row: span 2">=</button>

                <button onclick="adicionar('1')">1</button>
                <button onclick="adicionar('2')">2</button>
                <button onclick="adicionar('3')">3</button>

                <button onclick="adicionar('0')">0</button>
                <button onclick="adicionar('.')">.</button>
            </div>
        </section>

        <section class="btn-grid">
            <a class="btn-inicio" href="../html/funcoes-ex.html">Voltar</a>
            <a class="btn-inicio" href="../../index.html">Início</a>
        </section>
        <img class="divider" src="../../assets/imagens/Dividers/tumblr_343df90033408e75bc7f7bdf4ba3d0b2_09f2e3bb_640.webp" />
    </main>

    <footer>
        <p>&copy; 2025 Bea – Todos os direitos reservados</p>
    </footer>

    <script src="../../assets/js/funcoes.js"></script>
</body>

</html>

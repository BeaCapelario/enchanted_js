<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação de Email</title>
    <link rel="stylesheet" href="../css/email.css">
</head>

<body>
    <h1>Autenticação de Email</h1>
    <hr>
    <form action="
    ">
        <label for="nome">Nome Completo:</label>
        <br>

        <input type="text" id="nome" placeholder="Nome completo" />
        <br>
        <br>


        <label for="cpf">CPF:</label>
        <br>

        <input type="text" id="cpf">
        <br>
        <br>

        <label for="email">Email:</label>
        <br>
        <input type="text" id="email" placeholder="exemplo@gmail.com">
        <br>
        <br>

        <label for="senha">Senha:</label>
        <br>
        <input type="password" id="senha" />

        <br>
        <br>
        <p>Gênero:</p>
        <input type="radio" id="masculino" name="genero" value="masculino" />
        <label for="masculino">Masculino</label>


        <input type="radio" id="feminino" name="genero" value="feminino" />
        <label for="feminino">Feminino</label>


        <input type="radio" id="outro" name="genero" value="outro" />
        <label for="outro">Outro</label>

        <p>Interesses:</p>
        <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
        <label for="tecnologia">Tecnologia</label>

        <input type="checkbox" id="esportes" name="interesses" value="esportes">
        <label for="esportes">Esportes</label>

        <input type="checkbox" id="musica" name="interesses" value="musica">
        <label for="musica">Música</label>
        <br>
        <br>

        <label for="estado">Estado:</label>
        <select name="estado" id="estado">
            <option value="">Selecione...</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="RS">Rio grande do Sul</option>
        </select>
        <br>
        <br>

        <button type="submit">Cadastrar</button>
    </form>

    <footer class="footer">
        <img class="footer-img" src="https://i.pinimg.com/originals/fd/01/9c/fd019c34d6b2552b04ccadcf96ef91af.gif"
            alt="Fadinha sorridente">
        <div class="footer-btn">
            <a class="btn-voltar" href="../../index.html">Inicio</a>
        </div>
    </footer>

    <script src="../../assets/js/email.js"></script>

</body>

</html>
